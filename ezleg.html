<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Memory Game</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('pebg.jpg') no-repeat center center/cover;
            font-family: Arial, sans-serif;
        }
        #game-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            width: 80vw;
            max-width: 600px;
            aspect-ratio: 4 / 3;
        }
        .card {
            aspect-ratio: 1 / 1;
            cursor: pointer;
            perspective: 1000px;
        }
        .card-inner {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.4s;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
        }
        .card-front {
            background: #FFB6C1;
            border-radius: 10px;
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        #timer {
            position: absolute;
            top: 20px;
            font-size: 28px;
            color: #FF1493;
            background: white;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        #dialog, #wonDialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            text-align: center;
        }
        #dialog button, #wonDialog button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #FF69B4;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #dialog button:hover, #wonDialog button:hover {
            background: #FF1493;
        }
        #wonDialog img {
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
        }
          /* Back Button */
          .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff5e62;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .back-button:hover {
            background: #ff3c41;
        }
    </style>
</head>
<body>
     <button class="back-button" onclick="location.href='athlete.html'">Back</button>
   
    <div id="timer">60</div>
    <div id="game-container"></div>

    <div id="dialog">
        <h2>Time's Up!</h2>
        <button onclick="location.href='pegame.html'">Back</button>
        <button onclick="startGame()">Play Again</button>
    </div>

    <div id="wonDialog">
        <img src="won.png" alt="You Won!">
        <h2>You Won!</h2>
        <button onclick="startGame()">Play Again</button>
    </div>

    <script>
        const images = ["baseballball.jpg", "basketballball.jpg", "volleyballball.jpg", "sepakball.jpg", "soccerball.jpg", "golfball.jpg"];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let timer;
        let timeLeft = 60;

        function startGame() {
            const container = document.getElementById("game-container");
            container.innerHTML = "";
            document.getElementById("dialog").style.display = "none";
            document.getElementById("wonDialog").style.display = "none";
            timeLeft = 60;
            document.getElementById("timer").textContent = timeLeft;

            matchedPairs = 0;
            flippedCards = [];

            cards = [...images, ...images].sort(() => Math.random() - 0.5);

            cards.forEach((image, index) => {
                const card = document.createElement("div");
                card.classList.add("card");
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front"></div>
                        <div class="card-back"><img src="${image}" alt="Memory Image"></div>
                    </div>`;
                card.onclick = () => flipCard(card);
                container.appendChild(card);
            });

            clearInterval(timer);
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").textContent = timeLeft;
                if (timeLeft === 0) {
                    clearInterval(timer);
                    document.getElementById("dialog").style.display = "block";
                }
            }, 1000);
        }

        function flipCard(card) {
            if (flippedCards.length < 2 && !card.classList.contains("flipped")) {
                card.classList.add("flipped");
                flippedCards.push(card);

                if (flippedCards.length === 2) {
                    setTimeout(checkMatch, 800);
                }
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            if (cards[card1.dataset.index] === cards[card2.dataset.index]) {
                matchedPairs++;
                if (matchedPairs === images.length) {
                    clearInterval(timer);
                    document.getElementById("wonDialog").style.display = "block";
                }
            } else {
                card1.classList.remove("flipped");
                card2.classList.remove("flipped");
            }
            flippedCards = [];
        }

        startGame();
    </script>
</body>
</html>

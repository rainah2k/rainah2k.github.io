<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700&display=swap" rel="stylesheet">

<style>

/* I GOT THIS CODE FROM PINTEREST PLS DON'T JUDGE*/

* {  
margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #754e63, #462f69);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: 'Nunito', sans-serif;
}

.bubble {
  position: absolute;
  bottom: -50px;
  border-radius: 50%;
  background: rgba(255, 180, 230, 0.5);
  filter: drop-shadow(0 0 12px rgba(255,180,230,0.6)) drop-shadow(0 0 10px rgba(183,131,255,0.6));
  opacity: 0.6;
  animation-name: floatBubble;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

@keyframes floatBubble {
  0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0.6; }
  25% { transform: translateY(-35vh) translateX(10px) scale(0.9); opacity: 0.8; }
  50% { transform: translateY(-70vh) translateX(-10px) scale(1); opacity: 0.9; }
  75% { transform: translateY(-105vh) translateX(10px) scale(1.1); opacity: 0.7; }
  100% { transform: translateY(-140vh) translateX(0) scale(1.2); opacity: 0; }
}

.main {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
  z-index: 2;
}

.rainah-wrap {
  position: relative;
  width: 250px;
  height: 250px;
  animation: floatrainah 4s ease-in-out infinite;
}

@keyframes floatrainah {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-14px); }
}

.rainah-wrap::before {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  background: linear-gradient(45deg, #ffb3ec, #b983ff, #ffccf9);
  filter: blur(28px);
  animation: glowPulse 2.5s ease-in-out infinite;
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

.rainah {
  width: 90%;
  height: 90%;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.7);
  position: relative;
  z-index: 2;
}

.loading-text {
  font-size: 0.9rem;
  letter-spacing: 3px;
  font-weight: 700;
  color: #f8e6f4;
  text-shadow: 0 0 8px #ffb3ec, 0 0 12px #b983ff, 0 0 16px #ffccf9;
  animation: textGlow 2s ease-in-out infinite;
}

@keyframes textGlow {
  0%, 100% { text-shadow: 0 0 8px #ffb3ec, 0 0 12px #b983ff, 0 0 16px #ffccf9; }
  50% { text-shadow: 0 0 20px #ffb3ec, 0 0 24px #b983ff, 0 0 28px #ffccf9; }
}

.bareta {
  width: 320px;
  height: 15px;
  background: rgba(255,255,255,0.15);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 8px rgba(255,180,230,0.5);
}

.bareta span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ffb3ec, #b983ff, #ffccf9);
  border-radius: 12px;
  box-shadow: 0 0 12px #ffb3ec, 0 0 16px #b983ff, 0 0 20px #ffccf9;
  transition: width 0.2s ease-in-out;
}

.percent {
  font-size: 1rem;
  letter-spacing: 2px;
  opacity: 0.8;
  color: #d2c2ff;
}
</style>
</head>
<body>

<div class="main">
  <div class="rainah-wrap">                 
    <img src="me.jpg" class="rainah">
  </div>

  <div class="loading-text">LOADING</div>

  <div class="bareta">
    <span id="bareta"></span>
  </div>

  <div class="percent" id="percent">0%</div>
</div>

<script>
function createBubble(initial = false) {
  const bubble = document.createElement('div');
  bubble.classList.add('bubble');

  const size = Math.random() * 50 + 20;
  bubble.style.width = `${size}px`;
  bubble.style.height = `${size}px`;
  bubble.style.left = `${Math.random() * 95}%`;
  bubble.style.animationDuration = `${Math.random() * 10 + 15}s`;
  bubble.style.animationDelay = initial ? '0s' : `${Math.random() * 5}s`;

  document.body.appendChild(bubble);

  const totalDuration = (parseFloat(bubble.style.animationDuration) + parseFloat(bubble.style.animationDelay)) * 1000;
  setTimeout(() => bubble.remove(), totalDuration);
}

for (let i = 0; i < 15; i++) createBubble(true);

setInterval(() => createBubble(false), 400);

let progress = 0;
const bareta = document.getElementById('bareta');
const percent = document.getElementById('percent');

const load = setInterval(() => {
  if (progress < 100) {
    progress++;
    bareta.style.width = progress + '%';
    percent.textContent = progress + '%';
  } else {
    clearInterval(load);
    setTimeout(()=>{ window.location.href = 'rainah.html'; }, 800);
  }
}, 80);
</script>

</body>
</html>

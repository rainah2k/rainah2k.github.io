<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Color Mixing Game - Hard Level</title>
    <style>
        /* Body and Game Container */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #FFF9C4;
        }

        .game-container {
            background: #FFFDE7;
            border: 3px solid #FFECB3;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            transition: background 0.3s ease;
        }

        /* Timer Bar */
        #timer-container {
            width: 100%;
            height: 15px;
            background: #FFECB3;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        #timer-bar {
            height: 100%;
            background: #FBC02D;
            transition: width linear;
        }

        /* Score and Lives */
        #score-lives {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: #FBC02D;
            font-size: 20px;
        }

        /* Flexbox for Alignment */
        .color-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 20px 0;
        }

        /* Color Boxes and Result */
        .color-box, .result-box {
            width: 100px;
            height: 100px;
            border: 2px solid #FFD54F;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .result-box {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #FFF9C4;
            font-size: 40px;
            color: #FBC02D;
            transition: background 0.3s ease;
        }

        /* Choices */
        .choices {
            margin-top: 20px;
        }

        .choice-btn {
            background: #FFF59D;
            border: 2px solid #FFD54F;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            margin: 0 5px;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.1);
        }

        .choice-btn:hover {
            background: #FFECB3;
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.3s;
            background: #FF5252 !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
        }

        /* Game Over Dialog */
        .game-over-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-over-content {
            background: url('hays.jpg') center/cover;
            padding: 20px;
            text-align: center;
            border: 3px solid #FFECB3;
            border-radius: 20px;
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .game-over-content h1 {
            margin: 0;
            color: #FF5252;
        }

        .game-over-content button {
            margin: 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #FBC02D;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
/* Back Button */
.back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #FFD700; /* Gold */
    color: #000; /* Black text for contrast */
    border: none;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.back-button:hover {
    background: #FFEA70; /* Lighter yellow on hover */
}
    </style>
</head>
<body>
    <button class="back-button" onclick="location.href='chromatic.html'">Back</button>
    
    <div class="game-container" id="game-container">
        <h1 style="color: #FBC02D;">Color Mixing Game</h1>
        <div id="score-lives">
            <div id="score">Score: 0/10</div>
            <div id="incorrect">Incorrect: 0/3</div>
        </div>
        <div id="timer-container">
            <div id="timer-bar"></div>
        </div>
        <div class="color-row">
            <div id="color1" class="color-box"></div>
            <span style="font-size: 40px; color: #FBC02D;">+</span>
            <div id="color2" class="color-box"></div>
            <span style="font-size: 40px; color: #FBC02D;">=</span>
            <div id="result-color" class="result-box">?</div>
        </div>
        <div class="choices" id="choices-container"></div>
    </div>

    <div id="game-over" class="game-over-dialog" style="display: none;">
        <div class="game-over-content">
            <h1>Game Over</h1>
            <p id="final-score"></p>
            <button onclick="window.location.reload()">Play Again</button>
            <button onclick="window.location.href='chromatic.html'">Back</button>
        </div>
    </div>

    <script>
        let timer;
        let score = 0;
        let incorrect = 0;
        let rounds = 0;

        const colorCombinations = [
            { color1: "red", color2: "blue", result: "Purple" },
            { color1: "red", color2: "yellow", result: "Orange" },
            { color1: "blue", color2: "yellow", result: "Green" }
        ];
        const colorNames = ["Purple", "Orange", "Green", "Pink", "Brown", "Black"];
        let currentCombo;

        function startTimer() {
            clearTimeout(timer);
            const timerBar = document.getElementById('timer-bar');
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';

            // Smooth transition
            setTimeout(() => {
                timerBar.style.transition = 'width 5s linear';
                timerBar.style.width = '0%';
            }, 50);

            timer = setTimeout(() => {
                rounds++;
                incorrect++;
                updateUI();
                if (incorrect >= 3) {
                    showGameOver();
                } else {
                    loadNewLevel();
                }
            }, 5000);
        }

        function loadNewLevel() {
            if (rounds === 10 || incorrect >= 3) return showGameOver();

            currentCombo = colorCombinations[Math.floor(Math.random() * colorCombinations.length)];
            document.getElementById('color1').style.background = currentCombo.color1;
            document.getElementById('color2').style.background = currentCombo.color2;

            // Reset result box
            const resultBox = document.getElementById('result-color');
            resultBox.style.background = '#FFF9C4';
            resultBox.textContent = '?';

            let choices = new Set();
            choices.add(currentCombo.result);
            while (choices.size < 3) {
                choices.add(colorNames[Math.floor(Math.random() * colorNames.length)]);
            }

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';
            Array.from(choices).sort(() => Math.random() - 0.5).forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice;
                btn.onclick = () => checkAnswer(choice);
                choicesContainer.appendChild(btn);
            });

            startTimer();
        }

        function checkAnswer(choice) {
            if (choice === currentCombo.result) {
                score++;
                document.getElementById('result-color').style.background = choice.toLowerCase();
                document.getElementById('result-color').textContent = '';
                setTimeout(loadNewLevel, 500);
            } else {
                incorrect++;
                shake();
                if (incorrect >= 3) {
                    showGameOver();
                } else {
                    setTimeout(loadNewLevel, 500);
                }
            }
            rounds++;
            updateUI();
        }

        function updateUI() {
            document.getElementById('score').textContent = `Score: ${score}/10`;
            document.getElementById('incorrect').textContent = `Incorrect: ${incorrect}/3`;
        }

        function shake() {
            const container = document.getElementById('game-container');
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 300);
        }

        function showGameOver() {
            document.getElementById('final-score').textContent = `Score: ${score}/10`;
            document.getElementById('game-over').style.display = 'flex';
        }

        loadNewLevel();
    </script>
</body>
</html>

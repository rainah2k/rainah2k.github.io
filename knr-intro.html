<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bai na Bite</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --pink:#f7b2d9;
  --purple:#c3b5ff;
  --glass:rgba(255,255,255,.75);
  --text:#4b3b5f;
}

*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,var(--pink),var(--purple));
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}

.blob{
  position:absolute;
  width:300px;
  height:300px;
  background:rgba(255,255,255,.25);
  border-radius:50%;
  filter:blur(60px);
  animation:floatBlob 10s infinite alternate;
  z-index:0;
}
.blob.one{top:-100px;left:-100px;}
.blob.two{bottom:-120px;right:-120px;animation-delay:2s;}

@keyframes floatBlob{
  from{transform:translateY(0)}
  to{transform:translateY(80px)}
}

.intro{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(25px);
  border-radius:40px;
  padding:60px;
  max-width:900px;
  width:90%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  box-shadow:0 40px 100px rgba(0,0,0,.18);
  animation:fadeUp 1.2s ease;
  z-index:1;
}

.intro-text h1{
  font-size:52px;
  margin:0;
  color:var(--text);
}
.intro-text p{
  font-size:18px;
  opacity:.8;
  margin:15px 0 30px;
}

.start{
  padding:16px 45px;
  font-size:18px;
  border:none;
  border-radius:35px;
  background:linear-gradient(to right,var(--purple),var(--pink));
  color:white;
  cursor:pointer;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
  transition:.4s;
}
.start:hover{
  transform:scale(1.08);
}

.intro-img{
  display:flex;
  justify-content:center;
  align-items:center;
}
.intro-img img{
  width:100%;
  max-width:400px;
  border-radius:30px;
  box-shadow:0 25px 60px rgba(0,0,0,.25);
  animation:floatImg 4s ease-in-out infinite;
}

@keyframes floatImg{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:1024px){
  .intro{
    gap:30px;
    padding:50px;
  }
  .intro-text h1{
    font-size:42px;
  }
}

@media(max-width:768px){
  .intro{
    grid-template-columns:1fr;
    text-align:center;
    padding:40px 20px;
  }
  .intro-text h1{
    font-size:36px;
  }
  .intro-text p{
    font-size:16px;
  }
  .intro-img img{
    max-width:300px;
  }
}

@media(max-width:480px){
  .intro-text h1{
    font-size:28px;
  }
  .intro-text p{
    font-size:14px;
  }
  .start{
    padding:12px 30px;
    font-size:16px;
  }
  .intro-img img{
    max-width:250px;
  }
}

.back-btn{
  position:fixed;
  top:25px;
  left:25px;
  padding:12px 22px;
  background:#ae6bde;
  backdrop-filter:blur(12px);
  border-radius:40px;
  text-decoration:none;
  color:#ffffff;
  font-size:15px;
  z-index:1000;
  transition:.3s ease;
}
.back-btn:hover{
  background:rgba(194, 107, 173, 0.748);
  transform:scale(1.08);
}


</style>
</head>

<body>

<a href="main.html#projects" class="back-btn">← Back to Projects</a>
<div class="blob one"></div>
<div class="blob two"></div>

<div class="intro">

  <div class="intro-text">
    <h1>Tindahan ni Rainah</h1>
    <p>
      Welcome sa store ni Rainah!<br>
      Open to masisiba :>
    </p>
    <button class="start" onclick="oderna()">START ORDER</button>
  </div>

  <div class="intro-img">
    <img src="bgngkiosknirai.png">
  </div>

</div>

<script>
function oderna(){
  document.body.style.opacity="0";
  document.body.style.transition="1s";
  setTimeout(()=>{
    window.location.href="kiosknirainah.html";
  },1000);
}
</script>

</body>
</html>

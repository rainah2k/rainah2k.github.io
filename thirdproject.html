<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palaganas, Rainah</title>

<style>
*{
  box-sizing:border-box;
  font-family: 'Poppins', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top, #ffd6ea, #f8a6c9);
}

.calculator{
  background:#ffb6d9;
  padding:20px;
  border-radius:25px;
  width:340px;
  box-shadow:
    0 25px 40px rgba(0,0,0,0.25),
    inset 0 4px 8px rgba(255,255,255,0.6);
  transform: perspective(800px) rotateX(5deg);
}

.display{
  background:#ffe6f2;
  height:70px;
  border-radius:15px;
  margin-bottom:15px;
  padding:15px;
  text-align:right;
  font-size:2rem;
  color:#c2185b;
  box-shadow:
    inset 0 6px 10px rgba(0,0,0,0.15),
    inset 0 -4px 8px rgba(255,255,255,0.8);
  overflow:hidden;
}

.buttons{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

button{
  height:60px;
  border:none;
  border-radius:18px;
  font-size:1.3rem;
  cursor:pointer;
  color:#fff;
  background:linear-gradient(145deg, #ff5fa2, #ff2f7d);
  box-shadow:
    0 8px 0 #c2185b,
    0 14px 18px rgba(0,0,0,0.25);
  transition:all 0.15s ease;
}

button:hover{
  filter:brightness(1.1);
}

button:active{
  transform:translateY(8px);
  box-shadow:
    0 2px 0 #c2185b,
    0 6px 10px rgba(0,0,0,0.2);
}

.operator{
  background:linear-gradient(145deg, #ff8fc7, #ff5fa2);
}

.equal{
  grid-column:span 2;
  background:linear-gradient(145deg, #ff3d8b, #ff005c);
}

.clear, .del, .percent{
  background:linear-gradient(145deg, #ffb3d9, #ff7abf);
  color:#7a0033;
  box-shadow:
    0 8px 0 #b0004b,
    0 14px 18px rgba(0,0,0,0.25);
}
.back-btn{
  position:fixed;
  top:25px;
  left:25px;
  padding:12px 22px;
  background:#ee86c6ce;
  backdrop-filter:blur(12px);
  border-radius:40px;
  text-decoration:none;
  color:#ffffff;
  font-size:15px;
  z-index:1000;
  transition:.3s ease;
}
.back-btn:hover{
  background:rgba(255, 166, 234, 0.748);
  transform:scale(1.08);
}
</style>
</head>

<body>

  <a href="main.html#projects" class="back-btn">← Back to Projects</a>
  
<div class="calculator">
  <div class="display" id="display">0</div>

  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button class="del" onclick="deleteChar()">DEL</button>
    <button class="percent" onclick="percent()">%</button>
    <button class="operator" onclick="appendValue('/')">÷</button>

    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button class="operator" onclick="appendValue('*')">×</button>

    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button class="operator" onclick="appendValue('-')">−</button>

    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="operator" onclick="appendValue('+')">+</button>

    <button onclick="appendValue('0')">0</button>
    <button onclick="appendValue('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>

<script>
let display = document.getElementById("display");

function appendValue(value){
  if(display.innerText === "0"){
    display.innerText = value;
  } else {
    display.innerText += value;
  }
}

function clearDisplay(){
  display.innerText = "0";
}

function deleteChar(){
  display.innerText = display.innerText.slice(0, -1);
  if(display.innerText === "") display.innerText = "0";
}

function percent(){
  try{
    display.innerText = eval(display.innerText + "/100");
  }catch{
    display.innerText = "Error";
  }
}

function calculate(){
  try{
    display.innerText = eval(display.innerText);
  }catch{
    display.innerText = "Error";
  }
}
</script>

</body>
</html>

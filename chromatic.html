<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromatic Maestro - Harmonia Guardians</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(45deg, #FFF9C4, #FFECB3); /* Pastel Yellow Gradient */
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Game Rule */
        .game-rule {
            background: #FFFDE7; /* Soft pastel yellow */
            color: #333;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Container for buttons */
        .button-container {
            display: flex;
            gap: 15px;
        }

        /* Picture Buttons */
        .image-button {
            width: 120px;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .image-button img {
            width: 100%;
            display: block;
        }

        .image-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Back Button */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #cac48b; /* Pastel Yellow */
            color: #000; /* Black text */
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #FFECB3; /* Lighter pastel yellow on hover */
        }

        /* Logout Button */
        .logout-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #cac48b; /* Pastel Yellow */
            color: #000;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-button:hover {
            background: #FFECB3;
        }

        /* Confirmation Dialog */
        .confirmation-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFFDE7;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 1000;
        }

        .dialog-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: space-around;
        }

        .dialog-buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .confirm-btn {
            background: #FFF9C4;
            color: #000;
        }

        .confirm-btn:hover {
            background: #FFECB3;
        }

        .cancel-btn {
            background: #ccc;
            color: black;
        }

        .cancel-btn:hover {
            background: #aaa;
        }
    </style>
</head>
<body>
    
    <audio id="bgMusic" autoplay loop>
    <source src="bgmusic.mp3" type="audio/mp3">
    Your browser does not support the audio element.
    </audio>


    <button class="back-button" onclick="location.href='artsgame.html'">Back</button>

    <button class="logout-button" onclick="openLogoutDialog()">Logout</button>

    <div id="logoutDialog" class="confirmation-dialog">
        <p>Are you sure you want to log out?</p>
        <div class="dialog-buttons">
            <button class="confirm-btn" onclick="logout()">Yes</button>
            <button class="cancel-btn" onclick="closeLogoutDialog()">No</button>
        </div>
    </div>

    <div class="game-rule">
        <h2>RULE:</h2>
        <p>
            In <b>Chromatic Maestro</b>, players take on the challenge of mastering color mixing. Each round presents two primary colors, and the task is to guess the resulting color from three possible choices. Beat the timer. Choose your difficulty level to begin!
        </p>
    </div>

    <div class="button-container">
        <div class="image-button" onclick="location.href='chromeasy.html'">
            <img src="yeleasy.png" alt="Easy Level">
        </div>
        <div class="image-button" onclick="location.href='chromed.html'">
            <img src="yelmed.png" alt="Medium Level">
        </div>
        <div class="image-button" onclick="location.href='chromhard.html'">
            <img src="yelhard.png" alt="Hard Level">
        </div>
    </div>

    <script>
        function openLogoutDialog() {
            document.getElementById('logoutDialog').style.display = 'block';
        }

        function closeLogoutDialog() {
            document.getElementById('logoutDialog').style.display = 'none';
        }

        function logout() {
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>

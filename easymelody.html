<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Note Identification Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom right, #ffd1dc, #ffb6c1);
            font-family: Arial, sans-serif;
        }
        .game-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            width: 800px;
        }
        #note-container {
            width: 220px;
            height: 220px;
            border: 4px dashed #ff69b4;
            margin: 20px auto;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }
        /* Back Button */
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ff5e62;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #ff3c41;
        }
        
        #note-container img {
            max-width: 100%;
            max-height: 100%;
        }
        #note-name {
            font-size: 32px;
            color: #ff69b4;
            margin: 20px 0;
        }
        .note-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .note-buttons img {
            width: 100px;
            height: 100px;
            cursor: pointer;
            border-radius: 12px;
            transition: transform 0.1s, background-color 0.2s;
        }
        .note-buttons img.wrong {
            animation: shake 0.2s;
            background-color: #ff4d4d;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%, 75% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
        }
        .lives {
            font-size: 24px;
            color: #ff69b4;
            margin: 10px 0;
        }
        /* Dialog styling */
        .dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .dialog-content {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }
        .dialog-content img {
            width: 200px;
            margin-bottom: 20px;
        }
        .dialog-content button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .dialog-content button:hover {
            background-color: #ff4d4d;
        }
    </style>
</head>
<body>
    
    <button class="back-button" onclick="location.href='melody.html'">Back</button>
    
    <div class="game-container">
        <div id="note-container"></div>
        <div id="note-name"></div>
        <div class="lives" id="lives">Lives: 3</div>
        <div class="note-buttons" id="note-buttons"></div>
    </div>

    <!-- Dialog -->
    <div class="dialog" id="gameOverDialog">
        <div class="dialog-content">
            <img src="hays.jpg" alt="Game Over">
            <div id="finalScore"></div>
            <button onclick="restartGame()">Play Again</button>
            <button onclick="goBack()">Back</button>
        </div>
    </div>

    <script>
        const notes = [
            { name: "Sixteenth Note", img: "sixteenth.png" },
            { name: "Whole Note", img: "wholenote.png" },
            { name: "Half Note", img: "halfnote.png" },
            { name: "Eighth Note", img: "eighthnote.png" },
            { name: "Treble Clef", img: "trebleclef.png" }
        ];

        let lives = 3;
        let score = 0;

        function newRound() {
            if (lives <= 0) {
                showGameOver();
                return;
            }

            const noteContainer = document.getElementById("note-container");
            const noteName = document.getElementById("note-name");
            const noteButtons = document.getElementById("note-buttons");

            // Pick a random correct note
            const correctNote = notes[Math.floor(Math.random() * notes.length)];
            noteContainer.innerHTML = ""; // Clear container
            noteName.textContent = correctNote.name;

            // Pick 2 random wrong notes (ensure no duplicates)
            const shuffledNotes = notes
                .filter(note => note !== correctNote)
                .sort(() => 0.5 - Math.random())
                .slice(0, 2);

            // Add correct note to shuffled list and randomize order
            shuffledNotes.push(correctNote);
            shuffledNotes.sort(() => 0.5 - Math.random());

            // Display new buttons
            noteButtons.innerHTML = "";
            shuffledNotes.forEach(note => {
                const btn = document.createElement("img");
                btn.src = note.img;
                btn.alt = note.name;
                btn.onclick = () => checkAnswer(note, correctNote);
                noteButtons.appendChild(btn);
            });
        }

        function checkAnswer(selectedNote, correctNote) {
            const noteContainer = document.getElementById("note-container");
            if (selectedNote === correctNote) {
                noteContainer.innerHTML = `<img src="${selectedNote.img}" alt="${selectedNote.name}">`;
                score++;
                setTimeout(newRound, 1000); // Move to next round after 1 second
            } else {
                lives--;
                document.getElementById("lives").textContent = `Lives: ${lives}`;
                if (lives <= 0) {
                    showGameOver();
                    return;
                }
                const wrongBtn = [...document.querySelectorAll("img")].find(btn => btn.src.includes(selectedNote.img));
                wrongBtn.classList.add("wrong");
                setTimeout(() => wrongBtn.classList.remove("wrong"), 500);
            }
        }

        function showGameOver() {
            const gameOverDialog = document.getElementById("gameOverDialog");
            const finalScore = document.getElementById("finalScore");
            finalScore.textContent = `Your Score: ${score}`;
            gameOverDialog.style.display = "flex";  // Show the dialog
        }

        function restartGame() {
            lives = 3;
            score = 0;
            document.getElementById("lives").textContent = `Lives: 3`;
            document.getElementById("gameOverDialog").style.display = "none";  // Hide the dialog
            newRound();
        }

        function goBack() {
    window.location.href = 'melody.html';
}

        newRound();
    </script>
</body>
</html>

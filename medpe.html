<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Trivia Challenge</title>
    <style>
        /* General Styles */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('pebg.jpg') no-repeat center center fixed;
            background-size: cover;
        }
        /* Container */
        .container {
            background: rgba(255, 182, 193, 0.9); /* Soft pink overlay */
            border: 5px solid #ffb6c1;
            border-radius: 15px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        h1, h2 {
            color: #fff;
        }
        /* Timer Bar */
        .timer-bar {
    height: 10px;
    background: #ff7b8e;
    border-radius: 5px;
    margin-bottom: 15px;
    transition: width 0.1s linear;
}
        /* Buttons */
        .choice-btn {
            background: #ffb6c1;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }
        .choice-btn:hover {
            background: #ff9aae;
            transform: scale(1.05);
        }
        .choice-btn:active {
            background: #ff7b8e;
            transform: scale(0.95);
        }
        /* Result Dialog */
        #result-dialog {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 182, 193, 0.95);
            padding: 20px;
            border: 2px solid #ffb6c1;
            border-radius: 15px;
            z-index: 1000;
            max-width: 300px;
            text-align: center;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }
       #result-dialog button {
    background: #ff9aae;  /* Slightly darker pink */
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    margin-top: 15px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background 0.2s, transform 0.1s;
}
#result-dialog button:hover {
    background: #ff7b8e;
    transform: scale(1.05);
}
#result-dialog button:active {
    background: #ff5f70;
    transform: scale(0.95);
}
        /* Overlay */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 500;
        }
        .back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #b30000; /* Dark Red */
    color: white;
    border: none;
    padding: 10px 15px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.back-button:hover {
    background: #990000; /* Darker Red on Hover */
}
    </style>
</head>
<body>
    <button class="back-button" onclick="location.href='sportsquiz.html'">Back</button>
    <div class="container">
        <div id="timer-bar" class="timer-bar"></div>
        <div id="question-container"></div>
    </div>

    <!-- Dialog -->
    <div id="overlay"></div>
    <div id="result-dialog">
        <p id="result-text"></p>
        <button onclick="nextQuestion()">Next</button>
    </div>

    <script>
    const questions = [
        {
            question: "Which country has won the most FIFA World Cup titles?",
            options: ["Brazil", "Germany", "Argentina"],
            answer: "Brazil",
            explanation: "Brazil has won the FIFA World Cup a record five times."
        },
        {
            question: "What is the maximum score in a single frame of bowling?",
            options: ["10", "20", "30"],
            answer: "30",
            explanation: "A perfect frame consists of three consecutive strikes, scoring 30 points."
        },
        {
            question: "In tennis, what term is used for a score of zero?",
            options: ["Love", "Deuce", "Fault"],
            answer: "Love",
            explanation: "In tennis, 'Love' represents a score of zero."
        },
        {
            question: "What sport uses terms like 'alley-oop' and 'slam dunk'?",
            options: ["Basketball", "Volleyball", "Football"],
            answer: "Basketball",
            explanation: "Alley-oop and slam dunk are iconic moves in basketball."
        },
        {
            question: "How long is an Olympic swimming pool?",
            options: ["25 meters", "50 meters", "100 meters"],
            answer: "50 meters",
            explanation: "An Olympic swimming pool is 50 meters in length."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let shuffledQuestions = [];
    let timer;

    // Start game
    function startGame() {
        score = 0;
        shuffledQuestions = questions.sort(() => 0.5 - Math.random()).slice(0, 5);
        currentQuestion = 0;
        showQuestion();
    }

    // Show Question
    function showQuestion() {
        const q = shuffledQuestions[currentQuestion];
        let questionHTML = `<h2>${q.question}</h2>`;
        q.options.forEach(option => {
            questionHTML += `<button class="choice-btn" onclick="checkAnswer('${option}')">${option}</button>`;
        });
        document.getElementById("question-container").innerHTML = questionHTML;

        // Reset and start timer
        startTimer();
    }

    // Start Timer (Smooth Animation)
    function startTimer() {
        const timerBar = document.getElementById("timer-bar");
        timerBar.style.transition = "none";
        timerBar.style.width = "100%";
        setTimeout(() => {
            timerBar.style.transition = "width 10s linear";
            timerBar.style.width = "0%";
        }, 50);

        timer = setTimeout(() => {
            checkAnswer(null);
        }, 10000);
    }

    // Check Answer
    function checkAnswer(selected) {
        clearTimeout(timer);  // Stop the timer
        const q = shuffledQuestions[currentQuestion];
        const resultText = document.getElementById("result-text");
        if (selected === q.answer) {
            score++;
            resultText.innerHTML = `Correct! ${q.explanation}`;
        } else {
            resultText.innerHTML = `Wrong! The correct answer is <strong>${q.answer}</strong>.<br>${q.explanation}`;
        }
        showDialog();
    }

    // Show Dialog
    function showDialog() {
        document.getElementById("overlay").style.display = "block";
        document.getElementById("result-dialog").style.display = "block";
    }

    // Next Question or Show Result
    function nextQuestion() {
        document.getElementById("overlay").style.display = "none";
        document.getElementById("result-dialog").style.display = "none";

        currentQuestion++;
        if (currentQuestion < 5) {
            showQuestion();
        } else {
            showResult();
        }
    }

    // Show Result
    // Show Result
function showResult() {
    clearTimeout(timer);  // Stop the timer when game ends
    document.getElementById("timer-bar").style.display = "none";  // Hide the timer bar
    let resultMessage = score >= 3 ? "You Passed! 🎉" : "Better Luck Next Time!";
    document.getElementById("question-container").innerHTML = `
        <h2>${resultMessage}</h2>
        <p>Your score: ${score}/5</p>
        <button class="choice-btn" onclick="startGame()">Play Again</button>
     `;
}

    // Start the game when page loads
    window.onload = startGame;
</script>

</body>
</html>

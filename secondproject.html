<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

body {
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #f8c8f8, #d8b3ff);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

h1 {
  color: #fff;
  margin-bottom: 40px;
  font-size: 2.5rem;
  text-shadow: 0 0 10px #ffb3d9, 0 0 20px #d580ff;
}

.gallery {
  display: flex;
  gap: 25px;
  flex-wrap: wrap;
  justify-content: center;
}

.picturenirainah {
  width: 220px;
  text-align: center;
  border-radius: 25px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 8px 25px rgba(255, 192, 203, 0.3);
  background: rgba(255, 255, 255, 0.1);
  transition: transform 0.3s ease;
}
.picturenirainah:hover {
  transform: scale(1.05);
}

.picturenirainah img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 25px;
  transition: transform 0.5s ease;
}

.malayq {
  color: #58004f;
  margin-top: 10px;
  font-weight: 500;
  text-shadow: 0 0 5px #b57295;
  font-size: 1rem;
}

.fade { animation: fadeAnim 4s ease-in-out infinite alternate; }
@keyframes fadeAnim {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.scale { animation: scaleAnim 3s ease-in-out infinite alternate; }
@keyframes scaleAnim {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.rotate { animation: rotateAnim 5s ease-in-out infinite alternate; }
@keyframes rotateAnim {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(12deg); }
}

.flip { animation: flipAnim 4s ease-in-out infinite alternate; transform-style: preserve-3d; }
@keyframes flipAnim {
  0%, 100% { transform: rotateY(0deg); }
  50% { transform: rotateY(180deg); }
}

.slide { animation: slideAnim 3s ease-in-out infinite alternate; }
@keyframes slideAnim {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}

.bubble {
  position: absolute;
  border-radius: 50%;
  opacity: 0.5;
  animation: float 10s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) scale(0.5); opacity: 0.4; }
  50% { opacity: 0.7; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.back-btn{
  position:fixed;
  top:25px;
  left:25px;
  padding:12px 22px;
  background:#ae6bde;
  backdrop-filter:blur(12px);
  border-radius:40px;
  text-decoration:none;
  color:#ffffff;
  font-size:15px;
  z-index:1000;
  transition:.3s ease;
}
.back-btn:hover{
  background:rgba(194, 107, 173, 0.748);
  transform:scale(1.08);
}
</style>


</head>
<body>

    <a href="main.html#projects" class="back-btn">← Back to Projects</a>
    
<h1>Types of Animations in CSS</h1>

<div class="gallery">
  <div class="picturenirainah fade">
    <img src="kaneshiro.jpg" alt="Project 1">
    <div class="malayq">Fade</div>
  </div>
  <div class="picturenirainah scale">
    <img src="noah.jpg" alt="Project 2">
    <div class="malayq">Scale</div>
  </div>
  <div class="picturenirainah rotate">
    <img src="joker.jpg" alt="Project 3">
    <div class="malayq">Rotate</div>
  </div>
  <div class="picturenirainah flip">
    <img src="shelly.jpg" alt="Project 4">
    <div class="malayq">Flip</div>
  </div>
  <div class="picturenirainah slide">
    <img src="vinny.jpg" alt="Project 5">
    <div class="malayq">Slide</div>
  </div>
</div>

<script>
const colors = ['#ffb3d9', '#d9b3ff', '#ffcce6', '#e0b3ff'];
for (let i = 0; i < 30; i++) {
  const bubble = document.createElement('div');
  bubble.classList.add('bubble');
  const size = Math.random() * 20 + 20;
  bubble.style.width = size + 'px';
  bubble.style.height = size + 'px';
  bubble.style.left = Math.random() * 100 + 'vw';
  bubble.style.animationDuration = (Math.random() * 5 + 5) + 's';
  bubble.style.background = `radial-gradient(circle, ${colors[Math.floor(Math.random() * colors.length)]} 0%, rgba(255,255,255,0) 70%)`;
  document.body.appendChild(bubble);
}
</script>

</body>
</html>

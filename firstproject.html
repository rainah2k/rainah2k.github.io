<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Life Journey</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:linear-gradient(180deg,#1a0b2e,#2b1055,#3a1c71);
  color:#fff;
  overflow-x:hidden;
}

.back-btn{
  position:fixed;
  top:25px;
  left:25px;
  padding:12px 22px;
  background:rgba(255,255,255,0.18);
  backdrop-filter:blur(12px);
  border-radius:40px;
  text-decoration:none;
  color:#fff;
  font-size:15px;
  z-index:1000;
  transition:.3s ease;
}
.back-btn:hover{
  background:rgba(255,255,255,0.35);
  transform:scale(1.08);
}

.bubbles{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  overflow:hidden;
  z-index:-1;
}

.bubbles span{
  position:absolute;
  bottom:-150px;
  width:40px;
  height:40px;
  background:rgba(255,105,180,0.25);
  border-radius:50%;
  animation:float 20s linear infinite;
}

.bubbles span:nth-child(even){
  background:rgba(170,120,255,0.25);
}

@keyframes float{
  0%{transform:translateY(0) scale(0.6);}
  100%{transform:translateY(-120vh) scale(1.2);}
}

.stage{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:30px;
  padding:120px 5%;
  opacity:0;
  transition:1.2s ease;
}

.stage.show{
  opacity:1;
}

.stage.hide{
  opacity:0;
}
.stage img{
  width:100%;
  max-width:900px;
  border-radius:35px;
  box-shadow:0 40px 120px rgba(0,0,0,.6);
}

.stage h2{
  font-size:3rem;
  letter-spacing:3px;
}

.stage p{
  max-width:700px;
  text-align:center;
  font-size:17px;
  opacity:.85;
}

.scroll-hint{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  font-size:13px;
  opacity:.6;
  animation:move 1.6s infinite;
}

@keyframes move{
  0%,100%{transform:translate(-50%,0)}
  50%{transform:translate(-50%,12px)}
}
</style>
</head>
<body>

<a href="main.html#projects" class="back-btn">← Back to Projects</a>
<div class="scroll-hint">Scroll Down</div>

<div class="bubbles">
  <span style="left:10%;animation-duration:18s"></span>
  <span style="left:25%;animation-duration:22s"></span>
  <span style="left:40%;animation-duration:16s"></span>
  <span style="left:55%;animation-duration:26s"></span>
  <span style="left:70%;animation-duration:20s"></span>
  <span style="left:85%;animation-duration:24s"></span>
</div>

<section class="stage">
  <img src="RAINAH.png">
  <h2>RAINAH PALAGANAS</h2>
</section>

<section class="stage">
  <img src="BABY.png">
  <h2>INFANT</h2>
</section>

<section class="stage">
  <img src="KID.png">
  <h2>CHILDHOOD</h2>
</section>

<section class="stage">
  <img src="TEEN.png">
  <h2>TEEN</h2>
</section>

<section class="stage">
  <img src="ADULT.png">
  <h2>ADULTHOOD</h2>
</section>

<script>
const sections = document.querySelectorAll('.stage');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
      entry.target.classList.remove('hide');
    }else{
      entry.target.classList.add('hide');
    }
  });
},{ threshold:0.4 });

sections.forEach(sec => observer.observe(sec));
</script>

</body>
</html>
